name: CI

on:
  push:
    branches: main 
  pull_request:
    branches: main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check install.sh
        run: bash -n install.sh

      - name: Syntax check backup.sh
        run: bash -n ops/backup.sh

      - name: Validate docker-compose
        run: |
          cp .env.example .env
          sed -i 's/^WEBUI_SECRET_KEY=.*/WEBUI_SECRET_KEY=ci/' .env
          sed -i 's/^OPEN_TERMINAL_API_KEY=.*/OPEN_TERMINAL_API_KEY=ci/' .env
          docker compose -f docker-compose.yml config --quiet